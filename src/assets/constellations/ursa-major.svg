<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">URSA MAJOR</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Great Bear (Big Dipper) · Ursa Major</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="410" y1="160" x2="390" y2="290" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="390" y1="290" x2="270" y2="310" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="270" y1="310" x2="280" y2="190" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="280" y1="190" x2="410" y2="160" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="280" y1="190" x2="200" y2="240" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="200" y1="240" x2="140" y2="320" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="140" y1="320" x2="90" y2="420" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="270" y1="310" x2="410" y2="160" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Dubhe (Alpha Ursae Majoris) Mag: 1.79 -->
    <g id="dubhe">
      <circle cx="410" cy="160" r="12.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="410" cy="160" r="5.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="410" y="146.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dubhe</text>
    </g>
    <!-- Star: Merak (Beta Ursae Majoris) Mag: 2.37 -->
    <g id="merak">
      <circle cx="390" cy="290" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="390" cy="290" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="390" y="277" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Merak</text>
    </g>
    <!-- Star: Phecda (Gamma Ursae Majoris) Mag: 2.44 -->
    <g id="phecda">
      <circle cx="270" cy="310" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="270" cy="310" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="270" y="297" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Phecda</text>
    </g>
    <!-- Star: Megrez (Delta Ursae Majoris) Mag: 3.31 -->
    <g id="megrez">
      <circle cx="280" cy="190" r="9.9" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="280" cy="190" r="4.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="280" y="177.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Megrez</text>
    </g>
    <!-- Star: Alioth (Epsilon Ursae Majoris) Mag: 1.77 -->
    <g id="alioth">
      <circle cx="200" cy="240" r="12.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="200" cy="240" r="5.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="200" y="226.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alioth</text>
    </g>
    <!-- Star: Mizar (Zeta Ursae Majoris) Mag: 2.23 -->
    <g id="mizar">
      <circle cx="140" cy="320" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="140" cy="320" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="140" y="307" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mizar</text>
    </g>
    <!-- Star: Alkaid (Eta Ursae Majoris) Mag: 1.86 -->
    <g id="alkaid">
      <circle cx="90" cy="420" r="12.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="90" cy="420" r="5.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="90" y="406.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alkaid</text>
    </g>
  </g>
</svg>
