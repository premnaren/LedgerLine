<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">AQUILA</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Celestial Eagle · Aquila</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="180" y1="210" x2="250" y2="280" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="280" x2="320" y2="350" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="180" y1="210" x2="320" y2="350" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Tarazed (Gamma Aquilae) Mag: 2.72 -->
    <g id="tarazed">
      <circle cx="180" cy="210" r="10.8" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="180" cy="210" r="4.9" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="180" y="197.1" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tarazed</text>
    </g>
    <!-- Star: Altair (Alpha Aquilae) Mag: 0.77 -->
    <g id="altair">
      <circle cx="250" cy="280" r="15.8" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="280" r="7.2" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="264.8" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Altair</text>
    </g>
    <!-- Star: Alshain (Beta Aquilae) Mag: 3.71 -->
    <g id="alshain">
      <circle cx="320" cy="350" r="9.5" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="320" cy="350" r="4.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="320" y="337.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alshain</text>
    </g>
  </g>
</svg>
