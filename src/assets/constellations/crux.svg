<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">CRUX</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Southern Cross · Crux</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="250" y1="120" x2="250" y2="410" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="270" x2="340" y2="260" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="270" x2="210" y2="330" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="330" x2="250" y2="410" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="340" y1="260" x2="250" y2="120" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Gacrux (Gamma Crucis) Mag: 1.64 -->
    <g id="gacrux">
      <circle cx="250" cy="120" r="12.3" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="120" r="5.6" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="106.4" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Gacrux</text>
    </g>
    <!-- Star: Acrux (Alpha Crucis) Mag: 0.77 -->
    <g id="acrux">
      <circle cx="250" cy="410" r="15.8" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="410" r="7.2" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="394.8" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Acrux</text>
    </g>
    <!-- Star: Mimosa (Beta Crucis) Mag: 1.25 -->
    <g id="mimosa">
      <circle cx="340" cy="260" r="15.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="340" cy="260" r="6.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="340" y="245.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mimosa</text>
    </g>
    <!-- Star: Imai (Delta Crucis) Mag: 2.79 -->
    <g id="imai">
      <circle cx="160" cy="270" r="10.6" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="160" cy="270" r="4.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="160" y="257.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Imai</text>
    </g>
    <!-- Star: Ginan (Epsilon Crucis) Mag: 3.59 -->
    <g id="ginan">
      <circle cx="210" cy="330" r="9.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="210" cy="330" r="4.4" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="210" y="317.6" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ginan</text>
    </g>
  </g>
</svg>
