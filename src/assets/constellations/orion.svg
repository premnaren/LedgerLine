<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">ORION</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Hunter · Orion</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="160" y1="110" x2="340" y2="120" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="110" x2="140" y2="390" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="140" y1="390" x2="330" y2="400" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="330" y1="400" x2="340" y2="120" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="265" x2="250" y2="255" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="255" x2="290" y2="245" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="340" y1="120" x2="290" y2="245" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
    <line x1="160" y1="110" x2="210" y2="265" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
    <line x1="290" y1="245" x2="330" y2="400" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
    <line x1="210" y1="265" x2="140" y2="390" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Betelgeuse (Alpha Orionis) Mag: 0.42 -->
    <g id="betelgeuse">
      <circle cx="340" cy="120" r="15.4" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="340" cy="120" r="7" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="340" y="105" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Betelgeuse</text>
    </g>
    <!-- Star: Bellatrix (Gamma Orionis) Mag: 1.64 -->
    <g id="bellatrix">
      <circle cx="160" cy="110" r="12.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="160" cy="110" r="5.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="160" y="96.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bellatrix</text>
    </g>
    <!-- Star: Alnitak (Zeta Orionis) Mag: 1.74 -->
    <g id="alnitak">
      <circle cx="290" cy="245" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="290" cy="245" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="290" y="232" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alnitak</text>
    </g>
    <!-- Star: Alnilam (Epsilon Orionis) Mag: 1.69 -->
    <g id="alnilam">
      <circle cx="250" cy="255" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="255" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="242" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alnilam</text>
    </g>
    <!-- Star: Mintaka (Delta Orionis) Mag: 2.25 -->
    <g id="mintaka">
      <circle cx="210" cy="265" r="10.6" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="210" cy="265" r="4.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="210" y="252.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mintaka</text>
    </g>
    <!-- Star: Saiph (Kappa Orionis) Mag: 2.07 -->
    <g id="saiph">
      <circle cx="330" cy="400" r="11.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="330" cy="400" r="5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="330" y="387" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Saiph</text>
    </g>
    <!-- Star: Rigel (Beta Orionis) Mag: 0.18 -->
    <g id="rigel">
      <circle cx="140" cy="390" r="16.5" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="140" cy="390" r="7.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="140" y="374.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Rigel</text>
    </g>
  </g>
</svg>
