<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">LYRA</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Celestial Harp · Lyra</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="250" y1="110" x2="290" y2="220" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="290" y1="220" x2="210" y2="370" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="370" x2="300" y2="390" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="300" y1="390" x2="290" y2="220" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="110" x2="210" y2="370" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Vega (Alpha Lyrae) Mag: 0.03 -->
    <g id="vega">
      <circle cx="250" cy="110" r="17.2" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="110" r="7.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="94.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vega</text>
    </g>
    <!-- Star: Zeta Lyrae (Zeta 1 Lyrae) Mag: 4.34 -->
    <g id="zeta">
      <circle cx="290" cy="220" r="9.2" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="290" cy="220" r="4.2" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="290" y="207.8" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Zeta Lyrae</text>
    </g>
    <!-- Star: Sheliak (Beta Lyrae) Mag: 3.52 -->
    <g id="sheliak">
      <circle cx="210" cy="370" r="9.9" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="210" cy="370" r="4.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="210" y="357.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sheliak</text>
    </g>
    <!-- Star: Sulafat (Gamma Lyrae) Mag: 3.25 -->
    <g id="sulafat">
      <circle cx="300" cy="390" r="10.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="300" cy="390" r="4.6" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="300" y="377.4" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sulafat</text>
    </g>
  </g>
</svg>
