<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">CASSIOPEIA</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Seated Queen (W-Asterism) · Cassiopeia</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="90" y1="230" x2="170" y2="340" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="170" y1="340" x2="260" y2="190" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="260" y1="190" x2="350" y2="330" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="350" y1="330" x2="430" y2="220" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Caph (Beta Cassiopeiae) Mag: 2.28 -->
    <g id="caph">
      <circle cx="90" cy="230" r="11.4" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="90" cy="230" r="5.2" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="90" y="216.8" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Caph</text>
    </g>
    <!-- Star: Schedar (Alpha Cassiopeiae) Mag: 2.24 -->
    <g id="schedar">
      <circle cx="170" cy="340" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="170" cy="340" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="170" y="326.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Schedar</text>
    </g>
    <!-- Star: Navi (Gamma Cassiopeiae) Mag: 2.15 -->
    <g id="navi">
      <circle cx="260" cy="190" r="11.9" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="260" cy="190" r="5.4" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="260" y="176.6" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Navi</text>
    </g>
    <!-- Star: Ruchbah (Delta Cassiopeiae) Mag: 2.68 -->
    <g id="ruchbah">
      <circle cx="350" cy="330" r="10.6" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="350" cy="330" r="4.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="350" y="317.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ruchbah</text>
    </g>
    <!-- Star: Segin (Epsilon Cassiopeiae) Mag: 3.35 -->
    <g id="segin">
      <circle cx="430" cy="220" r="9.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="430" cy="220" r="4.4" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="430" y="207.6" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Segin</text>
    </g>
  </g>
</svg>
