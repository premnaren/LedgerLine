<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">LEO</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Lion · Leo</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="150" y1="160" x2="210" y2="220" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="220" x2="160" y2="360" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="210" y1="220" x2="320" y2="250" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="320" y1="250" x2="410" y2="350" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="410" y1="350" x2="160" y2="360" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="320" y1="250" x2="160" y2="360" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Rasalas (Mu Leonis) Mag: 3.88 -->
    <g id="rasalas">
      <circle cx="150" cy="160" r="9.5" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="150" cy="160" r="4.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="150" y="147.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Rasalas</text>
    </g>
    <!-- Star: Algieba (Gamma Leonis) Mag: 2.01 -->
    <g id="algieba">
      <circle cx="210" cy="220" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="210" cy="220" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="210" y="206.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Algieba</text>
    </g>
    <!-- Star: Regulus (Alpha Leonis) Mag: 1.36 -->
    <g id="regulus">
      <circle cx="160" cy="360" r="14.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="160" cy="360" r="6.7" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="160" y="345.3" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Regulus</text>
    </g>
    <!-- Star: Zosma (Delta Leonis) Mag: 2.56 -->
    <g id="zosma">
      <circle cx="320" cy="250" r="10.8" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="320" cy="250" r="4.9" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="320" y="237.1" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Zosma</text>
    </g>
    <!-- Star: Denebola (Beta Leonis) Mag: 2.14 -->
    <g id="denebola">
      <circle cx="410" cy="350" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="410" cy="350" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="410" y="336.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Denebola</text>
    </g>
  </g>
</svg>
