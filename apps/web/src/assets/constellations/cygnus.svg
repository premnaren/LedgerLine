<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">CYGNUS</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Swan (Northern Cross) · Cygnus</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="250" y1="90" x2="250" y2="250" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="250" x2="250" y2="430" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="110" y1="240" x2="250" y2="250" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="250" x2="390" y2="260" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="110" y1="240" x2="250" y2="90" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
    <line x1="390" y1="260" x2="250" y2="90" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Deneb (Alpha Cygni) Mag: 1.25 -->
    <g id="deneb">
      <circle cx="250" cy="90" r="15.0" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="90" r="6.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="75.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Deneb</text>
    </g>
    <!-- Star: Sadr (Gamma Cygni) Mag: 2.23 -->
    <g id="sadr">
      <circle cx="250" cy="250" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="250" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="236.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sadr</text>
    </g>
    <!-- Star: Albireo (Beta Cygni) Mag: 3.05 -->
    <g id="albireo">
      <circle cx="250" cy="430" r="10.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="430" r="4.6" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="417.4" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Albireo</text>
    </g>
    <!-- Star: Fawaris (Delta Cygni) Mag: 2.86 -->
    <g id="fawaris">
      <circle cx="110" cy="240" r="10.6" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="110" cy="240" r="4.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="110" y="227.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fawaris</text>
    </g>
    <!-- Star: Gienah (Epsilon Cygni) Mag: 2.48 -->
    <g id="gienah">
      <circle cx="390" cy="260" r="11.2" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="390" cy="260" r="5.1" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="390" y="246.9" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Gienah</text>
    </g>
  </g>
</svg>
