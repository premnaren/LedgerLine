<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">PERSEUS</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Hero · Perseus</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="250" y1="160" x2="150" y2="270" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="160" x2="320" y2="350" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="320" y1="350" x2="380" y2="430" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="150" y1="270" x2="320" y2="350" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Mirfak (Alpha Persei) Mag: 1.79 -->
    <g id="mirfak">
      <circle cx="250" cy="160" r="12.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="250" cy="160" r="5.5" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="250" y="146.5" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mirfak</text>
    </g>
    <!-- Star: Algol (Beta Persei) Mag: 2.09 -->
    <g id="algol">
      <circle cx="150" cy="270" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="150" cy="270" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="150" y="256.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Algol</text>
    </g>
    <!-- Star: Atik (Zeta Persei) Mag: 2.84 -->
    <g id="atik">
      <circle cx="320" cy="350" r="10.6" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="320" cy="350" r="4.8" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="320" y="337.2" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Atik</text>
    </g>
    <!-- Star: Menkib (Xi Persei) Mag: 3.98 -->
    <g id="menkib">
      <circle cx="380" cy="430" r="9.2" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="380" cy="430" r="4.2" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="380" y="417.8" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Menkib</text>
    </g>
  </g>
</svg>
