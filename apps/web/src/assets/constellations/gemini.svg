<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#648EFF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD75E9" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#8155D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8155D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#080712" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="500" height="500" fill="url(#spaceBg)" />

  <!-- Constellation Header Metadata -->
  <text x="250" y="38" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">GEMINI</text>
  <text x="250" y="56" fill="#BD75E9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Celestial Twins · Gemini</text>

  <!-- Constellation Stick-Figure Edges -->
  <g id="edges">
    <line x1="190" y1="130" x2="300" y2="150" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="190" y1="130" x2="160" y2="290" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="300" y1="150" x2="280" y2="310" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="290" x2="280" y2="310" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="280" y1="310" x2="230" y2="440" stroke="url(#primaryEdge)" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="290" x2="230" y2="440" stroke="rgba(189, 117, 233, 0.45)" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round" />
  </g>

  <!-- Astronomical Star Nodes -->
  <g id="stars">
    <!-- Star: Castor (Alpha Geminorum) Mag: 1.58 -->
    <g id="castor">
      <circle cx="190" cy="130" r="12.5" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="190" cy="130" r="5.7" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="190" y="116.3" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Castor</text>
    </g>
    <!-- Star: Pollux (Beta Geminorum) Mag: 1.14 -->
    <g id="pollux">
      <circle cx="300" cy="150" r="15.2" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="300" cy="150" r="6.9" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="300" y="135.1" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pollux</text>
    </g>
    <!-- Star: Mebsuta (Epsilon Geminorum) Mag: 3.06 -->
    <g id="mebsuta">
      <circle cx="160" cy="290" r="10.1" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="160" cy="290" r="4.6" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="160" y="277.4" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mebsuta</text>
    </g>
    <!-- Star: Wasat (Delta Geminorum) Mag: 3.53 -->
    <g id="wasat">
      <circle cx="280" cy="310" r="9.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="280" cy="310" r="4.4" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="280" y="297.6" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Wasat</text>
    </g>
    <!-- Star: Alhena (Gamma Geminorum) Mag: 1.93 -->
    <g id="alhena">
      <circle cx="230" cy="440" r="11.7" fill="url(#haloGlow)" opacity="0.65" />
      <circle cx="230" cy="440" r="5.3" fill="#FFFFFF" stroke="#BD75E9" stroke-width="1.5" />
      <text x="230" y="426.7" fill="#F7F4FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alhena</text>
    </g>
  </g>
</svg>
