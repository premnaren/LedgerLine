services:
  - type: web
    name: ledgerline-api
    env: node
    plan: standard
    region: oregon
    buildCommand: pnpm install --prod=false && pnpm --filter api prisma:generate && pnpm --filter api build
    startCommand: pnpm --filter api prisma:deploy && pnpm --filter api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ledgerline.vercel.app

databases:
  - name: ledgerline-postgres
    plan: standard
    region: oregon
    databaseName: ledgerline
    user: postgres
    postgresMajorVersion: 16

